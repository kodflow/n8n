name: Build Kodflow n8n Image (dev)

# Dev builds from unlock-enterprise-mode branch for local testing.
# Release builds are handled by kodflow-sync-upstream.yml (tag mirroring).

on:
  push:
    branches:
      - unlock-enterprise-mode
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kodflow/n8n
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Build and compile n8n
        run: CI=true node scripts/build-n8n.mjs
        env:
          CI: true
          NODE_OPTIONS: '--max-old-space-size=7168'

      - name: Generate tags
        id: meta
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          SHA_SHORT=$(git rev-parse --short HEAD)

          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev"
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${SHA_SHORT}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

          echo "## Dev Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base version: \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: \`dev\`, \`dev-${SHA_SHORT}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/images/n8n/Dockerfile.kodflow
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            N8N_VERSION=dev
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
